[package]
name = "half-hour-chime"
version = "2.0.0+20261113"
edition = "2021"
authors = ["Z.W.&AI"]
description = "半整点提醒 - 轻量安静的 Windows 桌面半整点报时与语音提醒工具"
license = "MIT"
build = "build.rs"

[[bin]]
name = "HalfHourChime"
path = "src/main.rs"

[dependencies]
# 原生矢量多主题 UI（自带软件光栅回退，零 WebView2 依赖）
slint = { version = "1.8", default-features = false, features = ["backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "raw-window-handle-06"] }
raw-window-handle = "0.6"

# 本地音频解码与实时音量控制（支持内置 WAV 及自定义 WAV/MP3/FLAC/OGG 音频）
rodio = { version = "0.19", default-features = false, features = ["wav", "symphonia-mp3", "flac", "vorbis"] }

# Windows 系统托盘与原生右键菜单
tray-icon = "0.19"

# 本地时间计算
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 结构化配置序列化与容错读取
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 轻量级同步 HTTP/HTTPS 客户端（使用 Windows 原生 Schannel TLS，无需内置 rustls/webpki-roots）
ureq = { version = "2.10", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# 轻量级同步 WebSocket 与 SHA-256（用于 Microsoft Edge TTS 在线神经网络语音接口）
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "native-tls"] }
sha2 = "0.10"

# Windows 原生 API（互斥体单实例、IPC 唤出、注册表自启、SetSystemTime、UAC 提权、DWM 圆角、SAPI 语音合成、PDH 性能计数器与内存回收）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Speech",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.8"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
