name: Windows Release Build & Publish

on:
  push:
    branches:
      - main
      - master
    paths:
      - "windows-native/**"
      - ".github/workflows/release-windows.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "是否自动发布到 GitHub Releases"
        required: true
        type: boolean
        default: true
      release_notes:
        description: "更新说明（可选）"
        required: false
        type: string
        default: "通过 GitHub Actions 自动编译并发布的 Windows 单文件版本。"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build HalfHourChime (x86_64-pc-windows-msvc)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            windows-native/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('windows-native/Cargo.toml', 'windows-native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust unit tests
        working-directory: windows-native
        run: cargo test --bin HalfHourChime --target x86_64-pc-windows-msvc

      - name: Build single-file Windows executable (Release)
        working-directory: windows-native
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage HalfHourChime.exe and version.json
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Get-Content "windows-native/build_version.txt" -Raw).Trim()
          $tagVer = $ver.Replace("+", "-")
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$tagVer" }
          New-Item -ItemType Directory -Force -Path "windows-native/dist" | Out-Null
          Copy-Item "windows-native/target/x86_64-pc-windows-msvc/release/HalfHourChime.exe" "windows-native/dist/HalfHourChime.exe" -Force

          $notes = "${{ inputs.release_notes }}"
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "通过 GitHub Actions 自动编译发布的单文件版本 ($ver)。"
          }
          $downloadUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$tag/HalfHourChime.exe"
          $manifest = [ordered]@{
            version      = $ver
            download_url = $downloadUrl
            package_type = "portable"
            notes        = $notes
          } | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText("windows-native/dist/version.json", $manifest, (New-Object System.Text.UTF8Encoding($false)))

          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built version=$ver tag=$tag"

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HalfHourChime-windows-x64-${{ steps.meta.outputs.version }}
          path: |
            windows-native/dist/HalfHourChime.exe
            windows-native/dist/version.json
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "半整点提醒 v${{ steps.meta.outputs.version }}"
          body: |
            ## 半整点提醒 Windows 原生单文件版 (`v${{ steps.meta.outputs.version }}`)

            - **编译平台**：Windows x86_64 (MSVC 静态链接，零外部运行库依赖)
            - **交付文件**：`HalfHourChime.exe`（双击即用，自带 `version.json` 供内置自动更新检查）
            - **自动更新配置示例**：在程序「设置 → 后台定期检查版本更新 → 更新接口地址」填入：
              `https://github.com/${{ github.repository }}/releases/latest`
          files: |
            windows-native/dist/HalfHourChime.exe
            windows-native/dist/version.json
