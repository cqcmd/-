name: Windows Release Build & Publish

on:
  push:
    branches:
      - main
      - master
    paths:
      - "windows-native/**"
      - ".github/workflows/release-windows.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "是否自动发布到 GitHub Releases"
        required: true
        type: boolean
        default: true
      release_notes:
        description: "更新说明（可选）"
        required: false
        type: string
        default: "通过 GitHub Actions 自动编译并发布的 Windows 单文件版本。"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build HalfHourChime (x86_64-pc-windows-msvc)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            windows-native/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('windows-native/Cargo.toml', 'windows-native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Resolve auto-increment version (3-part + YYYYMMDD, carry at 10)
        id: ver
        shell: pwsh
        run: |
          $today = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8)).ToString("yyyyMMdd")

          $ErrorActionPreference = "Continue"
          git fetch --tags --quiet 2>$null
          $existingTags = @(git tag -l "v*" 2>$null)
          $ErrorActionPreference = "Stop"

          $bestMaj = 2; $bestMin = 0; $bestPat = 0
          $bestScore = -1
          $prevTag = ""
          foreach ($item in $existingTags) {
            $t = "$item".Trim()
            if ($t -match '^v?(\d+)\.(\d+)\.(\d+)') {
              $m1 = [int]$Matches[1]; $m2 = [int]$Matches[2]; $m3 = [int]$Matches[3]
              $score = $m1 * 10000 + $m2 * 100 + $m3
              if ($score -gt $bestScore) {
                $bestScore = $score
                $bestMaj = $m1; $bestMin = $m2; $bestPat = $m3
                $prevTag = $t
              }
            }
          }

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v?(\d+)\.(\d+)\.(\d+)(?:[+-](\d{8}))?$') {
            $maj = [int]$Matches[1]
            $min = [int]$Matches[2]
            $pat = [int]$Matches[3]
            $d = if ($Matches[4]) { $Matches[4] } else { $today }
            $nextVer = "$maj.$min.$pat+$d"
          } else {
            $fileVer = (Get-Content "windows-native/build_version.txt" -Raw).Trim()
            if ($fileVer -match '^v?(\d+)\.(\d+)\.(\d+)') {
              $m1 = [int]$Matches[1]; $m2 = [int]$Matches[2]; $m3 = [int]$Matches[3]
              $score = $m1 * 10000 + $m2 * 100 + $m3
              if ($score -gt $bestScore) {
                $bestMaj = $m1; $bestMin = $m2; $bestPat = $m3
              }
            }

            $bestPat += 1
            if ($bestPat -ge 10) {
              $bestPat = 0
              $bestMin += 1
              if ($bestMin -ge 10) {
                $bestMin = 0
                $bestMaj += 1
              }
            }
            $nextVer = "$bestMaj.$bestMin.$bestPat+$today"
          }

          [System.IO.File]::WriteAllText((Join-Path $PWD "windows-native/build_version.txt"), "$nextVer`n", (New-Object System.Text.UTF8Encoding($false)))
          "APP_BUILD_VERSION_OVERRIDE=$nextVer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "prev_tag=$prevTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "next_ver=$nextVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved build version: $nextVer (previous tag: $prevTag)"

      - name: Run Rust unit tests
        working-directory: windows-native
        run: cargo test --bin HalfHourChime --target x86_64-pc-windows-msvc

      - name: Build single-file Windows executable (Release)
        working-directory: windows-native
        env:
          RUSTFLAGS: "-C link-arg=/OPT:REF -C link-arg=/OPT:ICF"
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Compress executable with UPX (preserve icon & version resource)
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exePath = "windows-native/target/x86_64-pc-windows-msvc/release/HalfHourChime.exe"
          New-Item -ItemType Directory -Force -Path "windows-native/dist" | Out-Null
          $distExe = "windows-native/dist/HalfHourChime.exe"
          Copy-Item $exePath $distExe -Force

          $rawBytes = (Get-Item $distExe).Length
          $rawMb = [Math]::Round($rawBytes / 1MB, 2)
          $packedMb = $rawMb
          $packInfo = "未压缩（$rawMb MB）"

          $upxInstalled = $false
          if (Get-Command upx -ErrorAction SilentlyContinue) {
            $upxInstalled = $true
          } else {
            try {
              choco install upx -y --no-progress | Out-Null
              $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
              if (Get-Command upx -ErrorAction SilentlyContinue) { $upxInstalled = $true }
            } catch {
              Write-Host "UPX install via choco skipped: $_"
            }
          }

          if ($upxInstalled) {
            $ErrorActionPreference = "Continue"
            upx --best --compress-resources=0 $distExe
            $upxPackExit = $LASTEXITCODE
            if ($upxPackExit -eq 0) {
              upx -t $distExe
              $upxTestExit = $LASTEXITCODE
            } else {
              $upxTestExit = 1
            }
            $ErrorActionPreference = "Stop"

            if ($upxPackExit -eq 0 -and $upxTestExit -eq 0) {
              $packedBytes = (Get-Item $distExe).Length
              $packedMb = [Math]::Round($packedBytes / 1MB, 2)
              $ratio = [Math]::Round(($packedBytes / $rawBytes) * 100, 1)
              $packInfo = "已启用 UPX 资源保留压缩：$rawMb MB → $packedMb MB（约 ${ratio}%）"
            } else {
              Copy-Item $exePath $distExe -Force
            }
          }
          Write-Host $packInfo
          "pack_info=$packInfo" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stage HalfHourChime.exe, version.json and Chinese release notes
        id: meta
        shell: pwsh
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ steps.ver.outputs.next_ver }}".Trim()
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = (Get-Content "windows-native/build_version.txt" -Raw).Trim()
          }
          $tagVer = $ver.Replace("+", "-")
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$tagVer" }

          $prevTag = "${{ steps.ver.outputs.prev_tag }}".Trim()
          $notesFile = "windows-native/RELEASE_NOTES.md"
          $useNotesFile = Test-Path $notesFile
          if ($useNotesFile -and $prevTag) {
            $ErrorActionPreference = "Continue"
            $changedNotes = @(git diff --name-only "$prevTag..HEAD" -- $notesFile 2>$null)
            $ErrorActionPreference = "Stop"
            if ($changedNotes.Count -eq 0) {
              $useNotesFile = $false
            }
          }

          $zhBullets = @()
          if ($useNotesFile) {
            $zhBullets = @(Get-Content $notesFile -Encoding utf8 | Where-Object { $_.Trim() -match '^-\s+.+' } | ForEach-Object { $_.Trim() })
          }

          if ($zhBullets.Count -eq 0) {
            $rawCommits = @()
            $ErrorActionPreference = "Continue"
            if ($prevTag) {
              $rawCommits = @(git log "$prevTag..HEAD" --no-merges --pretty=format:"%h|%s" 2>$null)
            }
            if ($rawCommits.Count -eq 0) {
              $rawCommits = @(git log -n 6 --no-merges --pretty=format:"%h|%s" 2>$null)
            }
            $ErrorActionPreference = "Stop"

            foreach ($entry in $rawCommits) {
              $parts = "$entry" -split '\|', 2
              if ($parts.Count -lt 2) { continue }
              $hash = $parts[0].Trim()
              $subj = $parts[1].Trim()
              if ($subj -match '[\u4e00-\u9fff]') {
                $zhBullets += "- $subj ($hash)"
              } else {
                $zhType = switch -Regex ($subj) {
                  '^feat'     { "功能增强与体验优化" }
                  '^fix'      { "问题修复与稳定性提升" }
                  '^refactor' { "架构与底层代码重构" }
                  '^build'    { "编译体积与依赖配置优化" }
                  '^ci'       { "自动构建与发布流程改进" }
                  '^docs'     { "文档与版本说明更新" }
                  default     { "常规功能维护与性能调优" }
                }
                $zhBullets += "- $zhType ($hash)"
              }
            }
          }

          $changelogMd = if ($zhBullets.Count -gt 0) { $zhBullets -join "`n" } else { "- 自动构建与常规稳定性维护更新" }

          $inputNotes = "$env:INPUT_RELEASE_NOTES".Trim()
          $manifestNotes = if (-not [string]::IsNullOrWhiteSpace($inputNotes) -and $inputNotes -ne "通过 GitHub Actions 自动编译并发布的 Windows 单文件版本。") {
            $inputNotes
          } elseif ($zhBullets.Count -gt 0) {
            ($zhBullets | Select-Object -First 4 | ForEach-Object { $_.TrimStart('-').Trim() }) -join "；"
          } else {
            "通过 GitHub Actions 自动编译发布的单文件版本 ($ver)。"
          }

          $downloadUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$tag/HalfHourChime.exe"
          $manifest = [ordered]@{
            version      = $ver
            download_url = $downloadUrl
            package_type = "portable"
            notes        = $manifestNotes
          } | ConvertTo-Json -Depth 4
          $manifestPath = Join-Path $PWD "windows-native/dist/version.json"
          [System.IO.File]::WriteAllText($manifestPath, $manifest, (New-Object System.Text.UTF8Encoding($false)))

          $packInfo = "${{ steps.pack.outputs.pack_info }}"
          $releaseLines = @(
            "## 半整点提醒 Windows 原生单文件版 (``v$ver``)",
            "",
            "### 本次更新内容",
            "$changelogMd",
            "",
            "### 构建与交付说明",
            "- **版本号规则**：三段式 + 日期（每段满 10 进位），本次版本 ``$ver``（PE 文件版本同步更新）",
            "- **编译平台**：Windows x86_64（MSVC 静态链接，零外部运行库依赖）",
            "- **体积优化**：$packInfo",
            "- **交付文件**：``HalfHourChime.exe``（双击即用）与 ``version.json``",
            "- **自动更新默认源（国内直连）**：``https://gitee.com/djjz/HalfHourChime/releases/latest``",
            "- **自动更新备用源**：``https://github.com/$env:GITHUB_REPOSITORY/releases/latest``"
          )
          $releaseBody = $releaseLines -join "`n"
          $notesPath = Join-Path $PWD "windows-native/dist/release_notes.md"
          [System.IO.File]::WriteAllText($notesPath, $releaseBody, (New-Object System.Text.UTF8Encoding($false)))

          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built version=$ver tag=$tag"

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HalfHourChime-windows-x64-${{ steps.meta.outputs.version }}
          path: |
            windows-native/dist/HalfHourChime.exe
            windows-native/dist/version.json
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "半整点提醒 v${{ steps.meta.outputs.version }}"
          body_path: windows-native/dist/release_notes.md
          files: |
            windows-native/dist/HalfHourChime.exe
            windows-native/dist/version.json

      - name: Sync repository and Release to Gitee mirror
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          $ErrorActionPreference = "Stop"
          $token = "$env:GITEE_TOKEN".Trim()
          $owner = "$env:GITEE_OWNER".Trim()
          $repo = "$env:GITEE_REPO".Trim()
          if ([string]::IsNullOrWhiteSpace($token) -or [string]::IsNullOrWhiteSpace($owner) -or [string]::IsNullOrWhiteSpace($repo)) {
            Write-Host "GITEE_TOKEN / GITEE_OWNER / GITEE_REPO 未全部配置，跳过 Gitee 镜像同步。"
            exit 0
          }
          Write-Host "::add-mask::$token"

          function Mask-Token([string]$text) {
            if ([string]::IsNullOrWhiteSpace($text)) { return "" }
            return $text.Replace($token, "***")
          }

          $ver = "${{ steps.meta.outputs.version }}".Trim()
          $tag = "${{ steps.meta.outputs.tag }}".Trim()
          $branch = if ($env:GITHUB_REF_TYPE -eq "branch" -and -not [string]::IsNullOrWhiteSpace($env:GITHUB_REF_NAME)) {
            $env:GITHUB_REF_NAME.Trim()
          } else {
            "main"
          }

          # 1. 确保本地存在发布 Tag，并将代码分支与 Tag 镜像推送到 Gitee
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $ErrorActionPreference = "Continue"
          $tagExists = git rev-parse -q --verify "refs/tags/$tag" 2>$null
          $ErrorActionPreference = "Stop"
          if (-not $tagExists) {
            git tag -f "$tag"
          }

          $remoteUrl = "https://${owner}:${token}@gitee.com/${owner}/${repo}.git"
          $ErrorActionPreference = "Continue"
          $pushBranchOut = git -c credential.helper= push --force $remoteUrl "HEAD:refs/heads/$branch" 2>&1
          $pushBranchCode = $LASTEXITCODE
          $pushTagOut = git -c credential.helper= push --force $remoteUrl "refs/tags/${tag}:refs/tags/${tag}" 2>&1
          $pushTagCode = $LASTEXITCODE
          $ErrorActionPreference = "Stop"

          if ($pushBranchCode -ne 0) {
            throw ("推送代码分支到 Gitee 失败: " + (Mask-Token ($pushBranchOut | Out-String)))
          }
          if ($pushTagCode -ne 0) {
            throw ("推送版本 Tag 到 Gitee 失败: " + (Mask-Token ($pushTagOut | Out-String)))
          }
          Write-Host "已同步代码分支 ($branch) 与 Tag ($tag) 到 https://gitee.com/$owner/$repo"

          # 2. 生成指向 Gitee 下载直链的 version.json
          $origManifest = Get-Content "windows-native/dist/version.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $giteeDir = "windows-native/dist/gitee"
          New-Item -ItemType Directory -Force -Path $giteeDir | Out-Null
          $giteeManifest = [ordered]@{
            version      = $origManifest.version
            download_url = "https://gitee.com/$owner/$repo/releases/download/$tag/HalfHourChime.exe"
            package_type = $origManifest.package_type
            notes        = $origManifest.notes
          } | ConvertTo-Json -Depth 4
          $giteeManifestPath = Join-Path $PWD "$giteeDir/version.json"
          [System.IO.File]::WriteAllText($giteeManifestPath, $giteeManifest, (New-Object System.Text.UTF8Encoding($false)))

          # 3. 创建或更新 Gitee Release
          $releaseName = "半整点提醒 v$ver"
          $releaseBody = (Get-Content "windows-native/dist/release_notes.md" -Raw -Encoding utf8) + "`n- **国内镜像源**：``https://gitee.com/$owner/$repo/releases/latest``"
          $apiBase = "https://gitee.com/api/v5/repos/$owner/$repo/releases"
          $encodedTag = [System.Uri]::EscapeDataString($tag)

          $releaseId = $null
          try {
            $existing = Invoke-RestMethod -Method Get -Uri "$apiBase/tags/${encodedTag}?access_token=$token"
            if ($existing -and $existing.id) {
              $releaseId = $existing.id
            }
          } catch {
            $releaseId = $null
          }

          if ($releaseId) {
            $patchBody = @{
              access_token = $token
              tag_name     = $tag
              name         = $releaseName
              body         = $releaseBody
              prerelease   = $false
            } | ConvertTo-Json -Depth 4
            $patchBytes = [System.Text.Encoding]::UTF8.GetBytes($patchBody)
            try {
              $updated = Invoke-RestMethod -Method Patch -Uri "$apiBase/$releaseId" -ContentType "application/json; charset=utf-8" -Body $patchBytes
              Write-Host "已更新现有 Gitee Release (id=$releaseId)"
            } catch {
              throw ("更新 Gitee Release 失败: " + (Mask-Token $_.Exception.Message))
            }

            try {
              $existingFiles = Invoke-RestMethod -Method Get -Uri "$apiBase/$releaseId/attach_files?access_token=$token"
              foreach ($f in @($existingFiles)) {
                if ($f.name -in @("HalfHourChime.exe", "version.json")) {
                  Invoke-RestMethod -Method Delete -Uri "$apiBase/$releaseId/attach_files/$($f.id)?access_token=$token" | Out-Null
                }
              }
            } catch {
              Write-Host "清理旧 Gitee 附件时跳过：$($_.Exception.Message)"
            }
          } else {
            $createBody = @{
              access_token     = $token
              tag_name         = $tag
              name             = $releaseName
              body             = $releaseBody
              prerelease       = $false
              target_commitish = $branch
            } | ConvertTo-Json -Depth 4
            $createBytes = [System.Text.Encoding]::UTF8.GetBytes($createBody)
            try {
              $created = Invoke-RestMethod -Method Post -Uri $apiBase -ContentType "application/json; charset=utf-8" -Body $createBytes
              $releaseId = $created.id
              Write-Host "已创建 Gitee Release (id=$releaseId, tag=$tag)"
            } catch {
              throw ("创建 Gitee Release 失败: " + (Mask-Token $_.Exception.Message))
            }
          }

          if (-not $releaseId) {
            throw "未能获取 Gitee Release ID，无法上传附件。"
          }

          # 4. 上传 HalfHourChime.exe 与 version.json 到 Gitee Release
          $exeDistPath = Join-Path $PWD "windows-native/dist/HalfHourChime.exe"
          foreach ($assetPath in @($exeDistPath, $giteeManifestPath)) {
            $tmpResp = [System.IO.Path]::GetTempFileName()
            try {
              $ErrorActionPreference = "Continue"
              $httpCode = (& curl.exe -sS -o $tmpResp -w "%{http_code}" -F "access_token=$token" -F "file=@$assetPath" "$apiBase/$releaseId/attach_files" | Out-String).Trim()
              $curlCode = $LASTEXITCODE
              $ErrorActionPreference = "Stop"

              $bodyText = if (Test-Path $tmpResp) { Get-Content $tmpResp -Raw -Encoding utf8 } else { "" }
              if ($curlCode -ne 0 -or -not ($httpCode -match '^2\d\d$')) {
                throw ("上传 Gitee Release 附件 $([System.IO.Path]::GetFileName($assetPath)) 失败 (curl=$curlCode, http=$httpCode): " + (Mask-Token $bodyText))
              }
              Write-Host "已上传附件到 Gitee Release：$([System.IO.Path]::GetFileName($assetPath)) (HTTP $httpCode)"
            } finally {
              Remove-Item $tmpResp -Force -ErrorAction SilentlyContinue
            }
          }


